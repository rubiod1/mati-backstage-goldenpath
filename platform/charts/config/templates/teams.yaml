{{- if or (eq .Values.stage "all") (eq .Values.stage "resources") }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.pilot.namespace }}
  labels:
    goldenpath.io/tenant: piloto
    istio.io/dataplane-mode: ambient
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: team-quota, namespace: {{ .Values.pilot.namespace }}}
spec:
  hard: {requests.cpu: '2', requests.memory: 2Gi, limits.cpu: '4', limits.memory: 4Gi, pods: '12'}
---
apiVersion: v1
kind: LimitRange
metadata: {name: defaults, namespace: {{ .Values.pilot.namespace }}}
spec:
  limits:
    - type: Container
      default: {cpu: 250m, memory: 256Mi}
      defaultRequest: {cpu: 50m, memory: 64Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: deny-by-default, namespace: {{ .Values.pilot.namespace }}}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: service-connectivity, namespace: {{ .Values.pilot.namespace }}}
spec:
  podSelector: {matchLabels: {goldenpath.io/workload: pilot}}
  policyTypes: [Ingress, Egress]
  ingress:
    # Ambient identifies kubelet health probes with this link-local SNAT address.
    # Permit only their port; namespace selectors do not match node-origin probes.
    - from:
        - ipBlock: {cidr: 169.254.7.127/32}
      ports: [{port: 8080, protocol: TCP}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: istio-system}}
        - podSelector: {matchLabels: {goldenpath.io/workload: pilot}}
      ports: [{port: 8080}, {port: 15008}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - ipBlock: {cidr: 10.60.64.0/24}
        - ipBlock: {cidr: 10.60.65.0/24}
        - ipBlock: {cidr: 10.60.66.0/24}
      ports: [{port: 5432}]
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: {name: strict, namespace: {{ .Values.pilot.namespace }}}
spec: {mtls: {mode: STRICT}}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: service-access, namespace: {{ .Values.pilot.namespace }}}
spec:
  selector: {matchLabels: {goldenpath.io/workload: pilot}}
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: [{{ .Values.pilot.namespace | quote }}, istio-system]
{{- if and .Values.awsResources .Values.pilot.securityGroupsForPods }}
---
apiVersion: vpcresources.k8s.aws/v1beta1
kind: SecurityGroupPolicy
metadata: {name: pilot-workloads, namespace: {{ .Values.pilot.namespace }}}
spec:
  podSelector: {matchLabels: {goldenpath.io/workload: pilot}}
  securityGroups:
    groupIds: [{{ .Values.pilot.workloadSecurityGroup | quote }}]
{{- end }}
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: {name: goldenpath-database-contract}
spec:
  # Declare API defaults explicitly to keep Argo's structured merge comparison stable.
  admission: true
  background: true
  emitWarning: false
  # The legacy fallback stays aligned with the rule's effective enforcement mode.
  validationFailureAction: Enforce
  rules:
    - name: require-owner-cost-size
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds: [platform.goldenpath.io/v1alpha1/PostgreSQLInstance]
      validate:
        allowExistingViolations: true
        failureAction: Enforce
        message: La base debe pertenecer al equipo piloto, tener centro de costo y un tamaño permitido.
        pattern:
          metadata:
            namespace: {{ .Values.pilot.namespace }}
            labels:
              platform.goldenpath.io/owner: piloto
              platform.goldenpath.io/cost-center: mati-platform
          spec:
            size: pequena | mediana
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: goldenpath-policy-reports}
rules:
  - apiGroups: [platform.goldenpath.io]
    resources: [postgresqlinstances]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: goldenpath-policy-reports}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: goldenpath-policy-reports}
subjects: [{kind: ServiceAccount, name: kyverno-reports-controller, namespace: kyverno}]
{{- end }}
